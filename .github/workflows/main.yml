name: Duyuru Takip Botu

on:
  schedule:
    # Her saat başı çalışması için (UTC zaman dilimine göre)
    - cron: '0 * * * *'
  workflow_dispatch: # İstediğinde elle çalıştırmak için buton ekler

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodları Çek
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Botu Çalıştır
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python staj_takip_bot_2.py
